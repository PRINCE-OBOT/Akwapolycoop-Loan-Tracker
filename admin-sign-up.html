<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta http-equiv="X-UA-Compatible" content="ie=edge"/><title>Admin Sign up page</title><script defer="defer" src="admin-sign-up.js"></script><link href="admin-sign-up.55f619a766de40d50c32.css" rel="stylesheet"></head><body><div class="container"><header><div class="logo-section"><img src="3b239622e6a2c964eb81.svg" alt="akwapolycoop loan tracker logo"/></div><div class="navigation-section"><a href="./index.html">Home</a> <a href="./admin-dashboard.html">Admin Dashboard</a> <a href="./admin-login.html">Admin Login</a></div></header><main><form action="" novalidate><h3 class="heading">Admin Sign Up</h3><div class="field-section"><div class="first-name"><label for="first-name">First Name</label> <input id="first-name" placeholder="First name" pattern="^[a-zA-Z]{1,}$" required/><output id="first-name-message" class="show-message"></output></div><div class="last-name"><label for="last-name">Last Name</label> <input id="last-name" placeholder="Last name" pattern="^[a-zA-Z]{1,}$" required/><output id="last-name-message" class="show-message"></output></div><div class="email"><label for="email">Email</label> <input type="email" id="email" placeholder="Email" pattern="^[a-zA-Z0-9.]{4,}@(gmail|yahoo|hotmail).com$" required/><output id="email-message" class="show-message"></output></div><div class="password"><label for="password">Password</label> <input id="password" placeholder="Password" pattern="^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).{7,}$" required/><output id="password-message" class="show-message"></output></div><div class="confirm-password"><label for="confirm-password">Confirm Password</label> <input id="confirm-password" placeholder="Confirm Password" required/><output id="confirm-password-message" class="show-message"></output></div></div><div class="signup-btn-section"><button class="btn-sign-up" type="button">Sign up</button><div class="display-signup-status"></div></div></form></main></div></body></html>

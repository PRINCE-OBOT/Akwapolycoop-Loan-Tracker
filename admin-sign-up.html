<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta http-equiv="X-UA-Compatible" content="ie=edge"/><title>Admin Sign up</title><script defer="defer" src="admin-sign-up.js"></script><link href="admin-sign-up.095ef98934b6b0bc2fb2.css" rel="stylesheet"></head><body><div class="container"><header><div class="logo-section"><img src="3b239622e6a2c964eb81.svg" alt="akwapolycoop loan tracker logo"/></div><div class="navigation-section"><a href="./index.html">Home</a> <a href="./admin-dashboard.html" class="admin-dashboard"><img src="d7bff852104bc8e8b78b.svg" alt=""/> Admin Dashboard</a> <a href="./admin-login.html" class="admin-login"><img src="0243af8d7a482b5e1941.svg" alt=""/> Admin Login</a></div></header><main><form action="" novalidate><h3 class="heading">Admin Sign Up</h3><img class="security-icon" src="b6608f86ded2eba6756c.svg" alt="security-image"/><div class="field-section"><div class="first-name"><label for="first-name">First Name <span class="required-asterisk">*</span></label> <input id="first-name" placeholder="James" pattern="^[a-zA-Z]{1,}$" required/><output id="first-name-message" class="show-message"></output></div><div class="last-name"><label for="last-name">Last Name <span class="required-asterisk">*</span></label> <input id="last-name" placeholder="Town" pattern="^[a-zA-Z]{1,}$" required/><output id="last-name-message" class="show-message"></output></div><div class="email"><label for="email">Email <span class="required-asterisk">*</span></label> <input type="email" id="email" placeholder="jamestown34@gmail.com" pattern="^[a-zA-Z0-9.]{4,}@(gmail|yahoo|hotmail).com$" required/><output id="email-message" class="show-message"></output></div><div class="password"><label for="password">Password <span class="required-asterisk">*</span></label> <input id="password" placeholder="Password" pattern="^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).{7,}$" required/><output id="password-message" class="show-message"></output></div><div class="confirm-password"><label for="confirm-password">Confirm Password <span class="required-asterisk">*</span></label> <input id="confirm-password" placeholder="Confirm Password" required/><output id="confirm-password-message" class="show-message"></output></div></div><div class="signup-btn-section"><button class="btn-sign-up" type="button">Sign up</button><div class="display-signup-status"></div></div></form></main><dialog closedby="any"><div class="dialog-signup-section"><h4>Submitting data...</h4></div></dialog></div></body></html>

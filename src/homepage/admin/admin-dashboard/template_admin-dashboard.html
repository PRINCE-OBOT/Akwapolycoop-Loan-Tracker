<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script>
      document.querySelector('html').style.display = 'none';
    </script>
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header_top-section">
          <div class="logo-section">
            <img
              src="../../assets/images/akp-loan-tracker-logo.svg"
              alt="akwapolycoop loan tracker logo"
            />
          </div>

          <nav class="adminProfileSection">
            <button type="button" class="logout-button">Logout</button>
          </nav>
        </div>

        <div class="header_middle_section">
          <h2 class="welcome">Welcome, Admin</h2>
        </div>

        <div class="header_bottom-section">
          <span class="admin-dashboard_tab-nav" data-content-key="admin-dashboard">
            <img src="../../assets/images/dashboard.svg" alt="Admin dashboard icon" />
            <h5>Admin Dashboard</h5>
          </span>

          <span class="admin-dashboard_tab-nav" data-content-key="loan-applicant-management">
            <img src="../../assets/images/profile.svg" alt="Loan Applicant Management" />
            <h5>Applicant Management</h5>
          </span>

          <span class="loaner-management_tab-nav" data-content-key="deposit-management">
            <img src="../../assets/images/community.svg" alt="Loan Management icon" />
            <h5>Deposit Management</h5>
          </span>

          <span class="loaner-management_tab-nav" data-content-key="withdrawal-management">
            <img src="../../assets/images/community.svg" alt="Loan Management icon" />
            <h5>Withdrawal Management</h5>
          </span>

          <span class="loaner-management_tab-nav" data-content-key="loan-management">
            <img src="../../assets/images/loaner_management.svg" alt="Loan Management icon" />
            <h5>Loan Management</h5>
          </span>
        </div>
      </header>

      <main>
        <div class="content-holder"></div>
      </main>
    </div>
  </body>
</html>

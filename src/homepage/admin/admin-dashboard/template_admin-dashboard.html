    <script>
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = window.indexedDB.open('CooperativeDB', 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {

                        db.createObjectStore('officeExpenses', { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains('shopExpenses')) {
                        db.createObjectStore('shopExpenses', { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains('shopRent')) {
                        db.createObjectStore('shopRent', { keyPath: 'id' });
                    }
                };
            });
        }

        async function loadShopRent() {
            const transaction = db.transaction(['shopRent'], 'readonly');
            const store = transaction.objectStore('shopRent');
            const request = store.get(1);
            request.onsuccess = () => {
                if (request.result) {
                    document.getElementById('shopRentAmount').value = request.result.amount;
                }
            };
        }

        async function saveShopRent() {
            const amount = parseFloat(document.getElementById('shopRentAmount').value);
            if (!amount || amount <= 0) {
                showMessage('Please enter a valid rent amount!', 'error');
                return;
            }
            const transaction = db.transaction(['shopRent'], 'readwrite');
            const store = transaction.objectStore('shopRent');
            store.put({ id: 1, amount: amount });
            transaction.oncomplete = () => {
                showMessage('Shop rent saved successfully! ₦' + amount.toLocaleString(), 'success');
            };
        }

        async function loadOfficeExpenses() {
            const transaction = db.transaction(['officeExpenses'], 'readonly');
            const store = transaction.objectStore('officeExpenses');
            const request = store.getAll();
            request.onsuccess = () => {
                const expenses = request.result;
                const tbody = document.getElementById('officeExpensesBody');
                tbody.innerHTML = '';
                if (expenses.length === 0) {
                    addOfficeExpenseRow();
                } else {
                    expenses.forEach((expense, index) => {
                        addOfficeExpenseRow(expense, index + 1);
                    });
                }
            };
        }

        async function loadShopExpenses() {
            const transaction = db.transaction(['shopExpenses'], 'readonly');
            const store = transaction.objectStore('shopExpenses');

                const tbody = document.getElementById('shopExpensesBody');
                tbody.innerHTML = '';
                if (expenses.length === 0) {
                    addShopExpenseRow();
                } else {
                    expenses.forEach((expense, index) => {
                        addShopExpenseRow(expense, index + 1);
                    });
                }
            };
        }

        

        function addShopExpenseRow(data = {}, serialNum = null) {
            const tbody = document.getElementById('shopExpensesBody');
            const rowCount = tbody.rows.length + 1;
            const sn = serialNum || rowCount;
            const row = tbody.insertRow();
            row.innerHTML = `
                <td class="serial-number">${sn}</td>
                <td><input type="text" name="description" value="${data.description || ''}" placeholder="e.g., Repairs, Maintenance, Painting"></td>
                <td><input type="number" name="amount" value="${data.amount || ''}" placeholder="0.00" step="0.01" min="0"></td>
                <td><input type="date" name="date" value="${data.date || ''}"></td>
                <td><div class="action-cell">
                    <button class="btn btn-edit" onclick="editRow(this)">Edit</button>
                    <button class="btn btn-delete" onclick="deleteShopExpenseRow(this, ${data.id})">Delete</button>
                </div></td>
            `;
        }


        

        function deleteShopExpenseRow(button, id) {
            if (!confirm('Delete this shop expense?')) return;
            const row = button.closest('tr');
            if (id) {
                const transaction = db.transaction(['shopExpenses'], 'readwrite');
                transaction.objectStore('shopExpenses').delete(id);
                transaction.oncomplete = () => {
                    row.remove();
                    updateSerialNumbers('shopExpensesBody');
                    showMessage('Expense deleted successfully!', 'success');
                };
            } else {
                row.remove();
                updateSerialNumbers('shopExpensesBody');
            }
        }

        function updateSerialNumbers(tbodyId) {
            const tbody = document.getElementById(tbodyId);
            for (let i = 0; i < tbody.rows.length; i++) {
                tbody.rows[i].cells[0].textContent = i + 1;
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 4000);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            loadShopRent();
            loadOfficeExpenses();
            loadShopExpenses();
        });
    </script>
</body>
</html>

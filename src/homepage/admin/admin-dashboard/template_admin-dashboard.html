<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script>
      document.querySelector('html').style.display = 'none';
    </script>
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header_top-section">
          <div class="logo-section">
            <img
              src="../../assets/images/akp-loan-tracker-logo.svg"
              alt="akwapolycoop loan tracker logo"
            />
          </div>

          <nav class="adminProfileSection">
            <button type="button" class="logout-button">Logout</button>
          </nav>
        </div>

        <div class="header_middle_section">
          <h2 class="welcome">Welcome,</h2>
          <h3 class="greeting"></h3>
        </div>

        <div class="header_bottom-section">
          <span class="admin-dashboard_tab-nav" data-content-key="admin-dashboard">
            <img src="../../assets/images/dashboard.svg" alt="Admin dashboard icon" />
            <h5>Admin Dashboard</h5>
          </span>

          <span class="loaner-management_tab-nav" data-content-key="loaner-management">
            <img src="../../assets/images/loaner_management.svg" alt="Loaner Management icon" />
            <h5>Loaner Management</h5>
          </span>
        </div>
      </header>

      <main>
        <div class="content-holder"></div>
      </main>
    </div>
    <dialog class="dialog-logout" closedby="any">
      <form action="" method="dialog" class="dialog-logout-section">
        <h4>Are you sure you want to log out</h4>
        <button class="btn-cancel">Cancel</button>
        <button class="btn-yes">Yes</button>
      </form>
    </dialog>
  </body>
</html>

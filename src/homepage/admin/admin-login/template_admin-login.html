<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akwapolycoop Loan Tracker - Admin Login</title>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo-section">
          <img
            src="../../assets/images/akp-loan-tracker-logo.svg"
            alt="akwapolycoop loan tracker logo"
          />
        </div>

        <div class="navigation-section">
          <a href="./index.html">Home</a>
          <a href="./admin-dashboard.html" class="admin-dashboard">
            <img src="../../assets/images/admin-dasboard-plain-color.svg" alt="" />
            Admin Dashboard
          </a>
          <a href="./admin-sign-up.html" class="admin-sign-up">
            <img src="../../assets/images/admin-sign-up_plain-color.svg" alt="" />
            Admin Sign up
          </a>
        </div>
      </header>

      <main>
        <form class="admin-login-form" action="" novalidate>
          <h3 class="heading">Admin Login</h3>
          <img class="security-icon" src="../../assets/images/security.svg" alt="security-image" />
          <div class="user-name">
            <label for="username">username</label>
            <input
              type="text"
              id="username"
              placeholder="username"
              pattern="^.{1,}$"
              data-set-field-validation-value="setEmptyFieldValidationValue"
              required
            />
            <output id="username-message" class="show-message"></output>
          </div>

          <div class="password">
            <label for="password">Password</label>
            <input
              type="text"
              id="password"
              placeholder="Password"
              pattern="^.{1,}$"
              data-set-field-validation-value="setEmptyFieldValidationValue"
              required
            />
            <output id="password-message" class="show-message"></output>
          </div>

          <div class="btn-login-section">
            <button class="btn-login" type="button">Login</button>
            <output class="display-login-progress"></output>
          </div>
        </form>
      </main>

      <dialog closedby="any">
        <form action="" class="dialog-login-section">
          <h4 class="login-status"></h4>
        </form>
      </dialog>
    </div>
  </body>
</html>

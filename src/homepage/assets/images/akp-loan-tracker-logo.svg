<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6ee7b7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer decorative circle -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#accentGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Main circle background -->
  <circle cx="200" cy="200" r="160" fill="url(#bgGradient)"/>
  
  <!-- Decorative ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#34d399" stroke-width="1" opacity="0.5"/>
  
  <!-- Shield shape for corporate feel -->
  <path d="M 200 80 L 260 100 L 260 180 Q 260 240 200 280 Q 140 240 140 180 L 140 100 Z" 
        fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.4"/>
  
  <!-- FCS Letters -->
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="84" font-weight="bold" 
        fill="#ffffff" text-anchor="middle" letter-spacing="8">FCS</text>
  
  <!-- Decorative underline -->
  <line x1="130" y1="235" x2="270" y2="235" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Corporate Society text -->
  <text x="200" y="265" font-family="Arial, sans-serif" font-size="8" font-weight="300" 
        fill="#6ee7b7" text-anchor="middle" letter-spacing="4">Akwapolycoop Corporate Society</text>
  
  <!-- Corner accent elements -->
  <circle cx="80" cy="80" r="3" fill="#34d399" opacity="0.6"/>
  <circle cx="320" cy="80" r="3" fill="#34d399" opacity="0.6"/>
  <circle cx="80" cy="320" r="3" fill="#34d399" opacity="0.6"/>
  <circle cx="320" cy="320" r="3" fill="#34d399" opacity="0.6"/>
  
  <!-- Subtle geometric pattern -->
  <path d="M 200 60 L 210 75 L 200 90 L 190 75 Z" fill="#6ee7b7" opacity="0.3"/>
  <path d="M 200 310 L 210 325 L 200 340 L 190 325 Z" fill="#6ee7b7" opacity="0.3"/>
</svg>
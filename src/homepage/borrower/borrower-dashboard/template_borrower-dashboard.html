<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script>
      document.querySelector('html').style.display = 'none';
    </script>
    <title>Borrower Dashboard</title>
  </head>

  <body>
    <div class="container">
      <header>
        <div class="logo-section">
          <img
            src="../../assets/images/akp-loan-tracker-logo.svg"
            alt="akwapolycoop loan tracker logo"
          />
        </div>

        <div class="navigation-section">
          <a href="./index.html">Home</a>

          <div class="profile">
            <!-- <img class="image-profile" src="" alt=""> -->
          </div>
        </div>
      </header>

      <main>
        <ul class="left-side-bar">
          <div class="deposit-section">
            <h3 class="outstanding-balance">0</h3>
            <button class="btn-deposit" data-content-key="deposit">Deposit</button>
          </div>

          <div class="bottom-left-sidebar">
            <li data-content-key="take-loan">Take Loan</li>
            <li data-content-key="my-loan">My Loan</li>
            <li data-content-key="my-deposit">My Deposit</li>
            <li class="logout-button">Logout</li>
          </div>
        </ul>
        <div class="content-holder">here</div>
      </main>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script>
      document.querySelector('html').style.display = 'none';
    </script>
    <title>Borrower Dashboard</title>
  </head>

  <body>
    <div class="container">
      <header>
        <div class="logo-section">
          <img
            src="../../assets/images/akp-loan-tracker-logo.svg"
            alt="akwapolycoop loan tracker logo"
          />
        </div>

        <div class="navigation-section">
          <a href="./index.html">Home</a>

          <div class="profile"></div>
        </div>
      </header>

      <main>
        <div class="left-side-bar">
          <div class="balance-section">
            <h4>Account Balance</h4>
            <div class="currency">
              <span class="naira-currency">&#x20A6;</span><span class="balance">0</span>
            </div>
          </div>

          <div class="deposit-and-withdrawal-section">
            <button class="btn-deposit" data-content-key="deposit">Deposit</button>
            <button class="btn-withdrawal" data-content-key="take-loan">Withdrawal</button>
          </div>

          <ul class="bottom-left-sidebar">
            <li class="my-dashboard-section">
              <img src="../../assets/images/dashboard.svg" class="icon" alt="" />
              <div data-content-key="my-dashboard">My Dashboard</div>
            </li>
            <li class="my-withdrawal-section">
              <img src="../../assets/images/security.svg" class="icon" alt="" />
              <div data-content-key="my-withdrawal">My Withdrawal</div>
            </li>
            <li class="my-loan-section">
              <img src="../../assets/images/community.svg" class="icon" alt="" />
              <div data-content-key="my-loan">My Loan</div>
            </li>
            <li class="my-deposit-section">
              <img src="../../assets/images/profile.svg" class="icon" alt="" />
              <div data-content-key="my-deposit">My Deposit</div>
            </li>
            <li class="logout-button">Logout</li>
          </ul>
        </div>

        <div class="content-holder"></div>
      </main>
    </div>
  </body>
</html>

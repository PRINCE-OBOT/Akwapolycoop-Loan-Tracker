<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script>
      document.querySelector('html').style.display = 'none';
    </script>
    <title>Borrower Dashboard</title>
  </head>

  <body>
    <div class="container">
      <header>
        <div class="logo-section">
          <img
            src="../../assets/images/akp-loan-tracker-logo.svg"
            alt="akwapolycoop loan tracker logo"
          />
        </div>

        <div class="navigation-section">
          <a href="./index.html">Home</a>

          <button type="button" class="logout-button">Logout</button>
        </div>
      </header>

      <main>
        <form action="" novalidate>
          <h3 class="heading">Loan Application Form</h3>

          <fieldset class="field-section personal-information">
            <legend>Personal Information</legend>

            <div class="first-name">
              <label for="first-name">
                First Name
                <span class="required-asterisk">*</span>
              </label>
              <input
                readonly
                type="text"
                id="first-name"
                placeholder="James"
                pattern="^[a-zA-Z]{1,}$"
                required
              />
              <output readonly id="first-name-message" class="show-message"></output>
            </div>

            <div class="last-name">
              <label for="last-name">
                Last Name
                <span class="required-asterisk">*</span>
              </label>
              <input
                readonly
                type="text"
                id="last-name"
                placeholder="Town"
                pattern="^[a-zA-Z]{1,}$"
                required
              />
              <output readonly id="last-name-message" class="show-message"></output>
            </div>

            <div class="email">
              <label for="email">
                Email
                <span class="required-asterisk">*</span>
              </label>
              <input
                readonly
                type="email"
                id="email"
                placeholder="jamestown34@gmaill.com"
                pattern="^[a-zA-Z0-9.]{4,}@(gmail|yahoo|hotmail).com$"
                required
              />
              <output readonly id="email-message" class="show-message"></output>
            </div>

            <div class="gender">
              <label for="gender">
                Select Gender
                <span class="required-asterisk">*</span>
              </label>
              <select name="gender" id="gender">
                <option value="null">-- Select gender --</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
              <output id="gender-message" class="show-message"></output>
            </div>

            <div class="phone-number">
              <label for="phone-number">
                Phone Number
                <span class="required-asterisk">*</span>
              </label>
              <input
                type="tel"
                id="phone-number"
                placeholder="08153555726"
                pattern="^[0-9]{10,11}$"
                required
              />
              <output id="phone-number-message" class="show-message"></output>
            </div>

            <div class="date-of-birth">
              <label for="date-of-birth">
                Date of Birth
                <span class="required-asterisk">*</span>
              </label>
              <input type="date" id="date-of-birth" />
              <output id="date-of-birth-message" class="show-message"></output>
            </div>

            <div class="resident-address">
              <label for="resident-address">
                Resident Address
                <span class="required-asterisk">*</span>
              </label>
              <textarea
                name=""
                id="resident-address"
                pattern="(?=.*\s)(?=.*[a-zA-Z])(?=.*[0-9])"
              ></textarea>
              <output id="resident-address-message" class="show-message"></output>
            </div>
          </fieldset>

          <fieldset class="field-section">
            <legend>Identity</legend>

            <div class="nin">
              <label for="nin">
                NIN
                <span class="required-asterisk">*</span>
              </label>
              <input
                type="text"
                id="nin"
                placeholder="43474898980"
                pattern="^[0-9]{11}$"
                required
              />
              <output id="nin-message" class="show-message"></output>
            </div>

            <div class="passport">
              <label for="passport">
                Passport
                <span class="required-asterisk">*</span>
              </label>
              <input type="file" id="passport" required />
              <output id="passport-message" class="show-message"></output>
            </div>
          </fieldset>

          <fieldset class="field-section">
            <legend>Employment & Income</legend>

            <div class="employment-status">
              <label for="employment-status">
                Employment Status
                <span class="required-asterisk">*</span>
              </label>
              <select id="employment-status">
                <!-- data-switch `showElement` and `hideElement` are function name in switchDisplay to switch the display mode of `business-name` -->
                <option value="" data-switch="hideElement">-- Select Employment Status --</option>
                <option value="employed (full-time)" data-switch="showElement">
                  Employed (Full-Time)
                </option>
                <option value="employed (part-time)" data-switch="showElement">
                  Employed (Part-Time)
                </option>
                <option value="self-employed" data-switch="showElement">Self-Employed</option>
                <option value="unemployed" data-switch="hideElement">Unemployed</option>
                <option value="student" data-switch="hideElement">Student</option>
                <option value="retired" data-switch="hideElement">Retired</option>
              </select>
              <output id="employment-status-message" class="show-message"></output>
            </div>

            <div class="company-or-business-name">
              <label for="company-or-business-name">
                Business Name
                <span class="required-asterisk">*</span>
              </label>
              <input
                type="text"
                id="company-or-business-name"
                placeholder="Company or Business Name"
                pattern="^[a-zA-Z0-9]{1,}$"
                required
              />
              <output id="company-or-business-name-message" class="show-message"></output>
            </div>

            <div class="monthly-income">
              <label for="monthly-income">
                Monthly Income
                <span class="required-asterisk">*</span>
              </label>
              <input
                type="text"
                id="monthly-income"
                placeholder="e.g 20000"
                pattern="^[0-9]{5,}$"
                required
              />
              <output id="monthly-income-message" class="show-message"></output>
            </div>

            <div class="current-job-year">
              <label for="current-job-year">
                Year at Current Job
                <span class="required-asterisk">*</span>
              </label>
              <input
                type="text"
                id="current-job-year"
                placeholder="e.g 2"
                pattern="^[0-9]{5,}$"
                required
              />
              <output id="current-job-year-message" class="show-message"></output>
            </div>
          </fieldset>

          <fieldset class="field-section">
            <legend>Loan Request</legend>

            <div class="desired-amount">
              <label for="desired-amount">
                Desired Amount
                <span class="required-asterisk">*</span>
              </label>
              <input
                type="text"
                id="desired-amount"
                placeholder="e.g 50000"
                pattern="^[0-9]{4,}$"
                required
              />
              <output id="desired-amount-message" class="show-message"></output>
            </div>

            <div class="tenor">
              <label for="tenor">
                Tenor (Days)
                <span class="required-asterisk">*</span>
              </label>
              <input type="text" id="tenor" placeholder="e.g 5" pattern="^[0-9]{1,}$" required />
              <output id="tenor-message" class="show-message"></output>
            </div>
          </fieldset>

          <div class="signup-btn-section">
            <button class="btn-submit-application" type="button">Submit Application</button>
            <span class="displayRegistrationProcess"></span>
          </div>
        </form>
      </main>

      <dialog class="dialog-logout" closedby="any">
        <div class="dialog-logout-section">
          <h4>Are you sure you want to log out</h4>
          <button type="button" class="btn-cancel">Cancel</button>
          <button type="button" class="btn-yes">Yes</button>
        </div>
      </dialog>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script>

    <title>Borrower Dashboard</title>
  </head>

  <body>
    <div class="container">
      <header>
        <div class="logo-section">
          <img
            src="../../assets/images/akp-loan-tracker-logo.svg"
            alt="akwapolycoop loan tracker logo"
          />
        </div>

        <div class="navigation-section">
          <a href="./index.html">Home</a>

          <button type="button" class="logout-button">Logout</button>
        </div>
      </header>

      <main>
        <div class="left-side-bar">
          <ul>
            <li data-custom-set="loan-applicant-form">Loan Application Form</li>
            <li data-custom-set="take-loan">Take Loan</li>
            <li data-custom-set="my-loan">My Loan</li>
          </ul>
        </div>
        <div class="content-holder">here</div>
      </main>

      <dialog class="dialog-logout" closedby="any">
        <form action="" method="dialog" class="dialog-logout-section">
          <h4>Are you sure you want to log out</h4>
          <button class="btn-cancel">Cancel</button>
          <button class="btn-yes">Yes</button>
        </form>
      </dialog>
    </div>

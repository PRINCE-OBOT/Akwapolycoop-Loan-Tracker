<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borrower Login</title>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo-section">
          <img
            src="../../assets/images/akp-loan-tracker-logo.svg"
            alt="akwapolycoop loan tracker logo"
          />
        </div>

        <div class="navigation-section">
          <a href="./index.html">Home</a>

          <a href="./borrower-dashboard.html" class="borrower-dashboard">
            <img src="../../assets/images/admin-dasboard-plain-color.svg" alt="" />
            Borrower Dashboard
          </a>

          <a href="./borrower-sign-up.html" class="borrower-sign-up">
            <img src="../../assets/images/admin-sign-up_plain-color.svg" alt="" />
            Join Us
          </a>
        </div>
      </header>

      <main>
        <form class="login-form" action="" novalidate>
          <h3 class="heading">Membership Login</h3>
          <img class="security-icon" src="../../assets/images/security.svg" alt="security-image" />
          <div class="membership-ID">
            <label for="membership-ID">Membership ID</label>
            <input
              type="text"
              id="membership-ID"
              placeholder="MEM202100008"
              data-set-field-validation-value="setEmptyFieldValidationValue"
              required
            />
            <output id="membership-ID-message" class="show-message"></output>
          </div>

          <div class="btn-login-section">
            <button class="btn-login" type="button">Login</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>

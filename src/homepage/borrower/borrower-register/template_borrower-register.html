<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script>
      document.querySelector('html').style.display = 'none';
    </script>
    <title>Borrower Registration</title>
  </head>

  <body>
    <div class="container">
      <header>
        <div class="logo-section">
          <img
            src="../../assets/images/akp-loan-tracker-logo.svg"
            alt="akwapolycoop loan tracker logo"
          />
        </div>

        <div class="navigation-section">
          <a href="./index.html">Home</a>

          <button type="button" class="logout-button">Logout</button>
        </div>
      </header>

      <main>
        <form action="" novalidate>
          <h3 class="heading">Borrower Registration Form</h3>

          <fieldset class="field-section">
            <legend>Personal Information</legend>
            <div class="first-name">
              <label for="first-name">First Name <span class="required-asterisk">*</span></label>
              <input
                readonly
                type="text"
                id="first-name"
                placeholder="James"
                pattern="^[a-zA-Z]{1,}$"
                required
              />
              <output id="first-name-message" class="show-message"></output>
            </div>
            <div class="last-name">
              <label for="last-name">Last Name <span class="required-asterisk">*</span></label>
              <input
                readonly
                type="text"
                id="last-name"
                placeholder="Town"
                pattern="^[a-zA-Z]{1,}$"
                required
              />
              <output id="last-name-message" class="show-message"></output>
            </div>
            <div class="email">
              <label for="email">Email <span class="required-asterisk">*</span></label>
              <input
                readonly
                type="email"
                id="email"
                placeholder="jamestown34@gmaill.com"
                pattern="^[a-zA-Z0-9.]{4,}@(gmail|yahoo|hotmail).com$"
                required
              />
              <output id="email-message" class="show-message"></output>
            </div>

            <div class="gender">
              <label for="gender">Select Gender <span class="required-asterisk">*</span></label>
              <select name="gender" id="gender">
                <option value="null">-- Select gender --</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
              <output id="gender-message" class="show-message"></output>
            </div>

            <div class="phone-number">
              <label for="phone-number"
                >Phone Number <span class="required-asterisk">*</span></label
              >
              <input
                type="tel"
                id="phone-number"
                placeholder="+234"
                pattern="^[0-9]{10,11}$"
                required
              />
              <output id="phone-number-message" class="show-message"></output>
            </div>
          </fieldset>

          <div class="signup-btn-section">
            <button class="btn-validate" type="button">Validate</button>
            <div class="display-signup-status"></div>
          </div>
        </form>
      </main>

      <dialog class="dialog-logout" closedby="any">
        <div class="dialog-logout-section">
          <h4>Are you sure you want to log out</h4>
          <button type="button" class="btn-cancel">Cancel</button>
          <button type="button" class="btn-yes">Yes</button>
        </div>
      </dialog>
    </div>
  </body>
</html>

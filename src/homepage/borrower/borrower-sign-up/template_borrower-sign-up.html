<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Borrower Sign up</title>
  </head>

  <body>
    <div class="container">
      <header>
        <div class="logo-section">
          <img
            src="../../assets/images/akp-loan-tracker-logo.svg"
            alt="akwapolycoop loan tracker logo"
          />
        </div>

        <div class="navigation-section">
          <a href="./index.html">Home</a>
          <a href="./borrower-login.html" class="borrower-login">
            <img src="../../assets/images/admin-login_plain-color.svg" alt="" />
            Borrower Login</a
          >

          <a href="./borrower-dashboard.html" class="borrower-dashboard">
            <img src="../../assets/images/admin-dasboard-plain-color.svg" alt="" />
            Borrower Dashboard</a
          >
        </div>
      </header>

      <main>
        <form action="" novalidate>
          <h3 class="heading">Borrower Sign up Form</h3>
          <img class="security-icon" src="../../assets/images/security.svg" alt="security-image" />

          <div class="field-section">
            <div class="first-name">
              <label for="first-name">First Name <span class="required-asterisk">*</span></label>
              <input
                type="text"
                id="first-name"
                placeholder="James"
                pattern="^[a-zA-Z]{1,}$"
                required
              />
              <output id="first-name-message" class="show-message"></output>
            </div>

            <div class="last-name">
              <label for="last-name">Last Name <span class="required-asterisk">*</span></label>
              <input
                type="text"
                id="last-name"
                placeholder="Town"
                pattern="^[a-zA-Z]{1,}$"
                required
              />
              <output id="last-name-message" class="show-message"></output>
            </div>

            <div class="email">
              <label for="email">Email <span class="required-asterisk">*</span></label>
              <input
                type="email"
                id="email"
                placeholder="jamestown34@gmail.com"
                pattern="^[a-zA-Z0-9.]{4,}@(gmail|yahoo|hotmail).com$"
                required
              />
              <output id="email-message" class="show-message"></output>
            </div>

            <div class="password">
              <label for="password">Password <span class="required-asterisk">*</span></label>
              <input
                type="text"
                id="password"
                placeholder="Password"
                pattern="^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).{7,}$"
                required
              />
              <output id="password-message" class="show-message"></output>
            </div>

            <div class="confirm-password">
              <label for="confirm-password"
                >Confirm Password <span class="required-asterisk">*</span></label
              >
              <input type="text" id="confirm-password" placeholder="Confirm Password" required />
              <output id="confirm-password-message" class="show-message"></output>
            </div>
          </div>

          <div class="signup-btn-section">
            <button class="btn-sign-up" type="button">Sign up</button>
            <div class="display-signup-status"></div>
          </div>
        </form>
      </main>

      <dialog closedby="any">
        <div class="dialog-signup-section">
          <h4 class="display_borrower-sign-up-status"></h4>
        </div>
      </dialog>
    </div>
  </body>
</html>
